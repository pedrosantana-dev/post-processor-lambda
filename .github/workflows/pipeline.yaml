name: CI/CD Pipeline
on:
   push:
      branches:
        - beta

jobs:
  build_and_deploy:
     runs-on: ubuntu-latest
     steps:
       - name: Checkout code
         uses: actions/checkout@v3

       - name: Set up Node.js
         uses: actions/setup-node@v3
         with:
            node-version: '24'

       - name: Install dependencies
         run: npm install --include=dev
         working-directory: src

       - name: Backup and patch schema.prisma for Lambda
         run: |
           cp prisma/schema.prisma prisma/schema.prisma.backup
           sed -i 's/binaryTargets = \[.*\]/binaryTargets = ["native", "rhel-openssl-3.0.x"]/' prisma/schema.prisma
         working-directory: src

       - name: Generate Prisma Client for Lambda
         run: ./node_modules/.bin/prisma generate
         working-directory: src

       - name: Restore original schema.prisma
         run: mv prisma/schema.prisma.backup prisma/schema.prisma
         working-directory: src

       - name: Prune devDependencies before packaging
         run: npm prune --omit=dev
         working-directory: src

       - name: Zip Lambda source and dependencies
         run: |
           cd src
           zip -r ../deployment.zip . -x "*.git*" "*.github*" "test/*" "*.log" "*md" "npm-debug.log" "yarn-debug.log"

       - name: Configure AWS credentials
         uses: aws-actions/configure-aws-credentials@v4
         with:
           aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
           aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
           aws-region: ${{ secrets.AWS_REGION }}

       - name: Upload deployment package to S3
         run: |
           aws s3 cp deployment.zip s3://pora-lambda-deployments/pora-scheduler-post-processor/${{ github.sha }}.zip

       - name: Deploy to AWS Lambda
         uses: appleboy/lambda-action@v0.2.0
         with:
            aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws_region: ${{ secrets.AWS_REGION }}
            function_name: pora-scheduler-post-processor
            s3_bucket: pora-lambda-deployments
            s3_key: pora-scheduler-post-processor/${{ github.sha }}.zip